name: Label PRs

# DISABLED IN THIS FORK — upstream contributor-community automation.
#
# Applies upstream's risk labels (core-architecture / agent-behavior / docs) to
# incoming PRs so maintainers can triage a queue of them. One person reviewing
# their own PRs does not need the queue.
#
# Left in place rather than deleted so it stays readable and is one edit away
# from working again. Original trigger:
#   on:
#     pull_request_target:
#       types: [opened, synchronize]
on:
  workflow_dispatch:

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
