name: No user data in PRs

# Hard-blocks any PR that adds or modifies user-layer (private data) files.
# These live ONLY on the candidate's machine per DATA_CONTRACT.md and must never
# enter the repo — they are personal job-search data. Sample/fixture data belongs
# under examples/. Tracked scaffolding (.gitkeep keepers, dir READMEs) is exempt.
# Paths mirror USER_PATHS in update-system.mjs. Uses the API (listFiles) so it
# works for fork PRs too.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # Needed so the script can read config/committed-user-layer.yml — this
      # fork's declared list of user-layer files it commits on purpose.
      #
      # Checked out at the BASE ref, not the PR head. The declaration is the
      # thing that GRANTS exemptions, so reading it from the head lets a PR
      # exempt itself simply by adding a path to the file in the same diff.
      # That was an accepted trade while this repo was private and
      # single-author; it stopped being acceptable the moment the repo went
      # public and anyone could open a PR. Reading the base means an exemption
      # only counts once it is already merged — i.e. once a human approved it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });

            // User-layer paths from DATA_CONTRACT.md and update-system.mjs.
            // voice-dna.md is omitted on purpose: it ships as a populated
            // system default, so edits to it are legit.
            const USER_PATHS = [
              /^cv\.md$/,
              /^config\/profile\.yml$/,
              /^modes\/_profile\.md$/,
              /^modes\/_custom\.md$/,
              /^portals\.yml$/,
              /^article-digest\.md$/,
              /^interview-prep\//,
              /^data\//,
              /^reports\//,
              /^output\//,
              /^jds\//,
              /^writing-samples\//,
            ];
            // Tracked scaffolding that legitimately lives under those dirs.
            const isScaffold = (f) => /(^|\/)\.gitkeep$/.test(f) || /(^|\/)README\.md$/.test(f);

            // ── Declared exceptions (Job-finder fork) ────────────────────────
            //
            // Upstream is a PUBLIC template repo, where every user-layer file
            // must stay out. This fork is a PRIVATE single-person repo, where a
            // gitignored file does not survive a fresh clone and the setup gets
            // rebuilt from a PDF every time. cv.md and config/profile.yml are
            // therefore committed on purpose.
            //
            // The exemption list is read from the same file the two Node guards
            // read (tests/user-layer-gitignored.test.mjs and test-all.mjs), so
            // all three cannot disagree about which paths are exempt — that
            // divergence is how one of them ends up silently unenforced.
            //
            // THREAT MODEL: the declaration is read from the BASE ref (see the
            // checkout step above), so a PR cannot grant itself an exemption by
            // adding a path to the file in the same diff. An exemption counts
            // only once it is merged, which is to say once a human approved it.
            // Every exemption in force is echoed into the CI log below so the
            // set can never be quiet.
            //
            // The file list itself still comes from the PR (listFiles API), so
            // fork PRs are covered exactly as before.
            let exempt = new Set();
            try {
              const decl = fs.readFileSync('config/committed-user-layer.yml', 'utf8');
              exempt = new Set(
                decl.split(/\r?\n/)
                  .map((l) => l.match(/^\s*-\s*path:\s*(.+?)\s*$/))
                  .filter(Boolean)
                  .map((m) => m[1].replace(/^["']|["']$/g, '')),
              );
            } catch {
              // Absent = no exceptions, i.e. upstream behaviour.
            }
            if (exempt.size) {
              core.info('Declared user-layer exceptions (config/committed-user-layer.yml):');
              for (const p of exempt) core.info(`  - ${p}`);
            }

            const bad = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename)
              .filter((f) => USER_PATHS.some((re) => re.test(f)) && !isScaffold(f) && !exempt.has(f));

            if (bad.length) {
              core.setFailed(
                'This PR adds/modifies user-layer (private data) files. These live ONLY on your ' +
                'machine per DATA_CONTRACT.md and must never be committed — use examples/ for ' +
                'sample data.\nOffending files:\n  ' + bad.join('\n  ')
              );
            } else {
              core.info('OK — no user-layer (private data) files touched.');
            }
