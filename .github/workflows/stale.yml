name: 'Close stale issues and PRs'
# DISABLED IN THIS FORK — upstream contributor-community automation.
#
# Auto-closes stale issues and PRs, which a busy public tracker needs and a
# one-person fork does not. Left enabled it would quietly close your own issues
# after the inactivity window.
#
# Left in place rather than deleted so it stays readable and is one edit away
# from working again. Original triggers:
#   on:
#     schedule: [{ cron: '0 6 * * 1' }]   # Mondays 06:00 UTC
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            activity in 60 days. It will be closed in 14 days if no further activity occurs.
            If this is still relevant, please comment to keep it open.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not had
            activity in 30 days. It will be closed in 14 days if no further activity occurs.
            If you're still working on this, please rebase and comment to keep it open.
          close-issue-message: 'Closed due to inactivity. Feel free to reopen if this is still relevant.'
          close-pr-message: 'Closed due to inactivity. Feel free to reopen with a fresh rebase if you want to continue.'
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-issue-close: 14
          days-before-pr-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,roadmap'
          exempt-pr-labels: 'pinned,security'
