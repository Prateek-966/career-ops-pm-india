# ---------------------------------------------------------------------------
# PRD B7 — Multi-market handling
#
# A market id is assigned by normalizing a posting's free-text location (see
# market-map.mjs, which owns the patterns and is mirrored into web/). An
# unmatched location becomes `unknown` and is SURFACED, never dropped — a role
# whose location string this file has not seen yet is still a real role.
#
# `currency` is the market's native currency. Compensation is stored and scored
# in its NATIVE currency and is never auto-converted: an INR equivalent may be
# shown as secondary context with its rate date visible, but silent FX inside a
# fit score is a correctness bug, so no scoring path may convert.
# ---------------------------------------------------------------------------
markets:
  india:
    label: "India"
    currency: "INR"
    visa_required: false
    locations:
      - "Bengaluru"
      - "Pune"
      - "Hyderabad"
      - "Mumbai"
      - "Delhi NCR"
      - "Chennai"
      - "Remote - India"
  uk_eu:
    label: "UK / EU"
    currency: "GBP"
    visa_required: true
    locations:
      - "London"
      - "Manchester"
      - "Dublin"
      - "Amsterdam"
      - "Berlin"
      - "Remote - EU"
  gulf:
    label: "Gulf"
    currency: "AED"
    visa_required: true
    locations:
      - "Dubai"
      - "Abu Dhabi"
      - "Riyadh"
      - "Doha"

# Optional secondary display only — never used for scoring (see markets note).
# Refresh the rate and the date together, or delete the block: PRD Part C says
# "no rate available means show nothing, not a stale figure".
fx_reference:
  as_of: "2026-08-25"
  # Units of the market currency per 1 INR equivalent is ambiguous, so store the
  # plain direction: 1 unit of `currency` = `inr` rupees.
  rates:
    - currency: "USD"
      inr: 87.5
    - currency: "GBP"
      inr: 112.0
    - currency: "EUR"
      inr: 95.0
    - currency: "AED"
      inr: 23.8

language:
  output: en

spend_tier: standard

cv:
  output_format: "html"

cover_letter:
  notice_period_days: 60
  primary_domain: "enterprise B2B software"
