# ---------------------------------------------------------------------------
# PRD A1.1 — Profile and title taxonomy
#
# Scoping principle: the target is ANY PM role the CV fits, not AI PM
# specifically. AI/GenAI is one strong lane among several and the most crowded
# one. The differentiated combination — enterprise B2B, supply chain/SCM, data
# products, API-first platforms, multi-market telco delivery — opens a wider
# surface, and in several of those lanes this is a rarer profile than in AI PM.
#
# The archetype ladder below is a SCORING AID, not a gate. A PM role in a
# domain absent from this list still reaches the rubric and is judged on
# transferable evidence (see modes/_custom.md → Domain fit / Transferability).
# ---------------------------------------------------------------------------
target_roles:
  primary:
    - "Senior Product Manager"
    - "Principal Product Manager"
    - "Lead Product Manager"
  archetypes:
    # Primary — direct, evidenced fit
    - name: "Platform / API Product Manager"
      level: "Senior/Principal"
      fit: "primary"
    - name: "Data Product Manager"
      level: "Senior/Principal"
      fit: "primary"
    - name: "Supply Chain / SCM Product Manager"
      level: "Senior/Principal"
      fit: "primary"
    - name: "AI/ML Product Manager"
      level: "Senior/Principal"
      fit: "primary"
    - name: "Enterprise B2B SaaS Product Manager"
      level: "Senior/Principal"
      fit: "primary"
    # Secondary — strong adjacent fit, transferable evidence
    - name: "Integration / iPaaS Product Manager"
      level: "Senior"
      fit: "secondary"
    - name: "ERP / Business Systems Product Manager"
      level: "Senior"
      fit: "secondary"
    - name: "Telco / OSS-BSS Product Manager"
      level: "Senior"
      fit: "secondary"
    - name: "Analytics / BI Product Manager"
      level: "Senior"
      fit: "secondary"
    # Adjacent — stretch or sideways, still worth surfacing
    - name: "Internal / Developer Platform Product Manager"
      level: "Senior"
      fit: "adjacent"
    - name: "Technical Program Manager"
      level: "Senior"
      fit: "adjacent"
    - name: "Product Operations / Product Strategy"
      level: "Senior"
      fit: "adjacent"

