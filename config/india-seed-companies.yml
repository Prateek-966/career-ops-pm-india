# India-hiring seed list — PRD v2 §B3 (Tier 2, ATS-direct)
#
# Input for:  node discover-ats.mjs --in config/india-seed-companies.yml [--write]
# Wrapper:    npm run seed:india          (preview)
#             npm run seed:india:write    (append resolved tenants to portals.yml)
#
# WHY THIS TIER IS THE BACKBONE
#
# Naukri, LinkedIn and Indeed listings overwhelmingly point back to a posting
# hosted on Greenhouse, Lever, Ashby, Workday or SmartRecruiters — all of which
# career-ops already supports and all of which are company-agnostic. Indian
# postings are therefore already reachable without a single new scraper. What is
# missing is not a provider; it is a list of which companies to ask. That list
# is this file.
#
# HOW TO GROW IT — the highest-leverage habit in the whole system
#
# Every time a LinkedIn or Naukri browse turns up a company not listed here, add
# it and re-run the wrapper. One manual sighting converts into permanent
# automated coverage of every future opening at that company. See
# `npm run add-company -- <url-or-name>` for the one-command version, and
# PRD §B6 for why that path is manual by design.
#
# SHAPE
#
#   - name: Acme                      # probed against every vendor, in order
#   - name: Acme
#     slug: acme-inc                  # explicit slug (camelCase Ashby boards)
#   - name: Acme
#     website: acme.com               # surfaced when unresolved, for follow-up
#   - name: Acme
#     workday: https://acme.wd3.myworkdayjobs.com/External   # full careers URL
#   - name: Acme
#     workday: { tenant: acme, site: External }              # or coordinates
#
# A company that does not resolve is NOT a failure — it is the Tier 3 input
# (PRD §B4: Firecrawl, scoped to seed-list domains with no detected ATS). Record
# the outcome in docs/india-sources.md either way.

